<script>
// Colour theme picker. The palettes are the :root[data-theme="NAME"] blocks
// below; dark is the default and has no attribute. Same localStorage key on
// every hub page, so one choice covers all. Applied before first paint so a
// saved choice doesn't flash dark on load.
var THEMES = [
    ['dark', 'Dark'],
    ['light', 'Light'],
    ['nord', 'Nord'],
    ['dracula', 'Dracula'],
    ['solarized', 'Solarized Dark'],
    ['monokai', 'Monokai'],
    ['contrast', 'High Contrast'],
    ['terminal', 'Terminal green'],
    ['confetti-night', 'Confetti Night'],
    ['neon', 'Neon Streamers'],
];
// "Shuffle" is a mode, not a palette: it shows a random palette from THEMES
// and moves to a different one every 5-10 minutes. The saved choice is
// 'shuffle'; the palette on screen and when it next changes live under
// confetti-theme-shuffle, so all pages show the same one and a reload does
// not reshuffle early.
var SHUFFLE_MIN_MS = 5 * 60 * 1000;
var SHUFFLE_MAX_MS = 10 * 60 * 1000;
var shuffling = false;
var shuffleTimer = null;
function themeKnown(name) {
    for (var i = 0; i < THEMES.length; i++) { if (THEMES[i][0] === name) return true; }
    return false;
}
function applyTheme(name) {
    if (!themeKnown(name) || name === 'dark') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', name);
}
function currentTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
}
function shuffleStep() {
    var now = Date.now();
    var st = null;
    try { st = JSON.parse(localStorage.getItem('confetti-theme-shuffle')); } catch (e) {}
    if (!st || !themeKnown(st.theme) || !(st.until > now)) {
        var avoid = st && themeKnown(st.theme) ? st.theme : currentTheme();
        var pick;
        do { pick = THEMES[Math.floor(Math.random() * THEMES.length)][0]; } while (pick === avoid);
        st = { theme: pick, until: now + SHUFFLE_MIN_MS + Math.random() * (SHUFFLE_MAX_MS - SHUFFLE_MIN_MS) };
        try { localStorage.setItem('confetti-theme-shuffle', JSON.stringify(st)); } catch (e) {}
    }
    applyTheme(st.theme);
    clearTimeout(shuffleTimer);
    shuffleTimer = setTimeout(function () { if (shuffling) shuffleStep(); }, Math.max(1000, st.until - now));
}
try {
    var savedTheme = localStorage.getItem('confetti-theme');
    if (savedTheme === 'shuffle') { shuffling = true; shuffleStep(); }
    else applyTheme(savedTheme);
} catch (e) {}
function setTheme(name) {
    clearTimeout(shuffleTimer);
    shuffling = (name === 'shuffle');
    if (shuffling) {
        // A fresh pick now, not the tail of an earlier shuffle.
        try { localStorage.removeItem('confetti-theme-shuffle'); } catch (e) {}
        shuffleStep();
    } else {
        applyTheme(name);
    }
    try { localStorage.setItem('confetti-theme', shuffling ? 'shuffle' : currentTheme()); } catch (e) {}
    syncThemeSelect();
}
function syncThemeSelect() {
    var sel = document.getElementById('theme-select');
    if (!sel) return;
    if (!sel.options.length) {
        THEMES.concat([['shuffle', 'Shuffle']]).forEach(function (t) {
            var o = document.createElement('option');
            o.value = t[0];
            o.textContent = t[1];
            sel.appendChild(o);
        });
    }
    sel.value = shuffling ? 'shuffle' : currentTheme();
}
</script>

<body>

<header>
    <h1>SYSLOG MESSAGES</h1>
    <a href="/" class="btn-nav">Dashboard</a>
    <span class="btn-nav-current">Syslog</span>
    <a href="/timeline" class="btn-nav">Timeline</a>
    <div class="status">
        <span id="clock" class="clock" title="Hub clock — every correlation on this page depends on it">clock: --</span>
        &nbsp;|&nbsp;
        <span id="count" class="count">--</span>
        &nbsp;|&nbsp;
        <span id="updated">--</span>
        <select id="theme-select" class="btn-nav theme-select" aria-label="Colour theme" onchange="setTheme(this.value)"></select>
        <script>syncThemeSelect();</script>
    </div>
</header>

<div class="pinned" id="pinned">
    <span id="pinned-text"></span>
    <button id="clear-window">Clear window</button>
</div>

<div class="filters">
    <label for="f-source">Source</label>
    <select id="f-source"><option value="">all</option></select>

    <label for="f-sev">Severity &le;</label>
    <select id="f-sev">
        <option value="all">all</option>
        <option value="3">3 err</option>
        <option value="4">4 warning</option>
        <option value="5">5 notice</option>
        <option value="6">6 info</option>
    </select>

    <label for="f-window">Window</label>
    <select id="f-window">
        <option value="15">15 min</option>
        <option value="60">1 hour</option>
        <option value="360">6 hours</option>
        <option value="1440">24 hours</option>
        <option value="525600" selected>everything</option>
    </select>

    <label for="f-q">Search</label>
    <input type="text" id="f-q" placeholder="text, mnemonic, interface…">

    <button id="refresh-now">Refresh</button>
    <button id="toggle-live" class="on">Live Refresh: On</button>
</div>

<table id="log">
    <thead>
        <tr>
            <th style="width:170px">Received</th>
            <th style="width:120px">Source</th>
            <th style="width:80px">Sev</th>
            <th style="width:200px">Mnemonic</th>
            <th>Message</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<div class="empty" id="empty">No messages match.</div>

<script>
(function() {
    "use strict";

    var SEV_NAMES = ["emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"];
    var params = new URLSearchParams(window.location.search);
    // A window handed over from the dashboard pins the view: no auto-refresh,
    // because the point is to look at a moment that has already passed.
    var pinFrom = params.get("from");
    var pinTo = params.get("to");
    var timer = null;

    if (params.get("host")) {
        // filled in once the source list loads
    }
    if (params.get("q")) document.getElementById("f-q").value = params.get("q");
    if (params.get("severity")) document.getElementById("f-sev").value = params.get("severity");

    function esc(s) {
        if (s === null || s === undefined) return "";
        var d = document.createElement("div");
        d.appendChild(document.createTextNode(String(s)));
        return d.innerHTML;
    }

    function localTime(iso) {
        if (!iso) return "";
        var t = iso.indexOf("Z") === -1 && iso.indexOf("+") === -1 ? iso + "Z" : iso;
        var d = new Date(t);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, {hour12: false});
    }

    function buildQuery() {
        var qs = new URLSearchParams();
        var host = document.getElementById("f-source").value;
        var sev = document.getElementById("f-sev").value;
        var q = document.getElementById("f-q").value.trim();

        if (pinFrom || pinTo) {
            if (pinFrom) qs.set("from", pinFrom);
            if (pinTo) qs.set("to", pinTo);
        } else {
            qs.set("minutes", document.getElementById("f-window").value);
        }
        if (host) qs.set("host", host);
        if (sev !== "all") qs.set("severity", sev);
        if (q) qs.set("q", q);
        qs.set("limit", "2000");
        return qs.toString();
    }

    function render(rows) {
        var tbody = document.querySelector("#log tbody");
        var html = "";
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var sev = (r.severity === null || r.severity === undefined) ? null : r.severity;
            var sevCls = sev === null ? "sev-x" : "sev-" + sev;
            var sevText = sev === null ? "?" : sev + " " + SEV_NAMES[sev];
            html += "<tr>";
            html += "<td class='time'>" + esc(localTime(r.received_at)) + "</td>";
            html += "<td class='src' title='" + esc(r.source_ip) + "'>" + esc(r.host || r.source_ip) + "</td>";
            html += "<td class='sevcol'><span class='sev " + sevCls + "'>" + esc(sevText) + "</span></td>";
            html += "<td class='mnem'>" + esc(r.mnemonic || "") + "</td>";
            html += "<td class='msg' title='" + esc(r.device_time || "") + "'>" + esc(r.message) + "</td>";
            html += "</tr>";
        }
        tbody.innerHTML = html;
        document.getElementById("empty").style.display = rows.length ? "none" : "";
        document.getElementById("count").textContent =
            rows.length + " message" + (rows.length !== 1 ? "s" : "") + (rows.length >= 2000 ? " (capped)" : "");
        document.getElementById("updated").textContent = "Updated: " + new Date().toLocaleTimeString();
    }

    function refresh() {
        fetch("/api/syslog?" + buildQuery())
            .then(function(r) { return r.json(); })
            .then(render)
            .catch(function() {
                document.getElementById("updated").textContent = "Hub unreachable";
            });
    }

    // The hub's own clock decides whether a pinned window means anything, so
    // it is shown next to the message count rather than hidden in a status page.
    function loadClock() {
        fetch("/api/time")
            .then(function(r) { return r.json(); })
            .then(function(t) {
                var el = document.getElementById("clock");
                if (!t.chrony) {
                    el.className = "clock warn";
                    el.textContent = "clock: unknown (" + (t.reason || "no chrony") + ")";
                    return;
                }
                var c = t.chrony;
                var ms = c.system_offset_s === null ? null : Math.abs(c.system_offset_s * 1000);
                var parts = ["stratum " + c.stratum];
                if (ms !== null) parts.push((ms < 1 ? ms.toFixed(2) : ms.toFixed(1)) + " ms off");
                if (c.local_only) parts.push("local clock");
                else if (c.source) parts.push("via " + c.source);

                if (!c.synced) el.className = "clock bad";
                else if (c.local_only || (ms !== null && ms > 100)) el.className = "clock warn";
                else el.className = "clock ok";

                el.textContent = "clock: " + parts.join(", ") + (c.synced ? "" : " — UNSYNCED");
            })
            .catch(function() {
                var el = document.getElementById("clock");
                el.className = "clock warn";
                el.textContent = "clock: unavailable";
            });
    }

    function loadSources() {
        fetch("/api/syslog/sources")
            .then(function(r) { return r.json(); })
            .then(function(rows) {
                var sel = document.getElementById("f-source");
                var want = params.get("host") || "";
                var html = "<option value=''>all</option>";
                for (var i = 0; i < rows.length; i++) {
                    html += "<option value='" + esc(rows[i].name) + "'>" +
                            esc(rows[i].name) + " (" + rows[i].count + ")</option>";
                }
                // A host handed over by a dashboard link may not have logged yet.
                if (want && rows.every(function(r) { return r.name !== want; })) {
                    html += "<option value='" + esc(want) + "'>" + esc(want) + " (none yet)</option>";
                }
                sel.innerHTML = html;
                if (want) sel.value = want;
                refresh();
            });
    }

    // Independent of the pin: a pinned window forces refresh off entirely
    // (the point is a moment that has already passed — see below), while
    // this flag is the viewer's own on/off choice for the live, unpinned
    // view. Defaults on, matching the auto-refresh this page always had.
    var liveRefresh = true;

    function setAutoRefresh() {
        if (timer) clearInterval(timer);
        if (!pinFrom && !pinTo && liveRefresh) timer = setInterval(refresh, 15000);
    }

    function setLiveButton(on) {
        var btn = document.getElementById("toggle-live");
        btn.textContent = "Live Refresh: " + (on ? "On" : "Off");
        btn.className = on ? "on" : "off";
    }

    if (pinFrom || pinTo) {
        document.getElementById("pinned").style.display = "flex";
        document.getElementById("pinned-text").textContent =
            "Pinned window: " + localTime(pinFrom) + " → " + localTime(pinTo) + " (auto-refresh off)";
        document.getElementById("f-window").disabled = true;
        document.getElementById("toggle-live").style.display = "none";
    }

    document.getElementById("toggle-live").addEventListener("click", function() {
        liveRefresh = !liveRefresh;
        setLiveButton(liveRefresh);
        setAutoRefresh();
    });

    document.getElementById("clear-window").addEventListener("click", function() {
        pinFrom = pinTo = null;
        document.getElementById("pinned").style.display = "none";
        document.getElementById("f-window").disabled = false;
        document.getElementById("toggle-live").style.display = "";
        setAutoRefresh();
        refresh();
    });

    ["f-source", "f-sev", "f-window"].forEach(function(id) {
        document.getElementById(id).addEventListener("change", refresh);
    });
    document.getElementById("f-q").addEventListener("keyup", function(e) {
        if (e.key === "Enter") refresh();
    });
    document.getElementById("refresh-now").addEventListener("click", refresh);

    loadSources();
    loadClock();
    setInterval(loadClock, 60000);
    setAutoRefresh();
})();
</script>
</body>
</html>
