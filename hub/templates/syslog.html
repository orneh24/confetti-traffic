<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Syslog</title>
<script>
// Colour theme picker. The palettes are the :root[data-theme="NAME"] blocks
// below; dark is the default and has no attribute. Same localStorage key on
// every hub page, so one choice covers all. Applied before first paint so a
// saved choice doesn't flash dark on load.
var THEMES = [
    ['dark', 'Dark'],
    ['light', 'Light'],
    ['monokai', 'Monokai'],
    ['contrast', 'High Contrast'],
    ['terminal', 'Terminal green'],
    ['confetti-night', 'Confetti Night'],
    ['neon', 'Neon Streamers'],
];
// "Shuffle" is a mode, not a palette: it shows a random palette from THEMES
// and moves to a different one every 5-10 minutes. The saved choice is
// 'shuffle'; the palette on screen and when it next changes live under
// confetti-theme-shuffle, so all pages show the same one and a reload does
// not reshuffle early.
var SHUFFLE_MIN_MS = 5 * 60 * 1000;
var SHUFFLE_MAX_MS = 10 * 60 * 1000;
var shuffling = false;
var shuffleTimer = null;
function themeKnown(name) {
    for (var i = 0; i < THEMES.length; i++) { if (THEMES[i][0] === name) return true; }
    return false;
}
function applyTheme(name) {
    if (!themeKnown(name) || name === 'dark') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', name);
}
function currentTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
}
function shuffleStep(fromTimer) {
    var now = Date.now();
    var st = null;
    try { st = JSON.parse(localStorage.getItem('confetti-theme-shuffle')); } catch (e) {}
    if (!st || !themeKnown(st.theme) || !(st.until > now)) {
        var avoid = st && themeKnown(st.theme) ? st.theme : currentTheme();
        var pick;
        do { pick = THEMES[Math.floor(Math.random() * THEMES.length)][0]; } while (pick === avoid);
        st = { theme: pick, until: now + SHUFFLE_MIN_MS + Math.random() * (SHUFFLE_MAX_MS - SHUFFLE_MIN_MS) };
        try { localStorage.setItem('confetti-theme-shuffle', JSON.stringify(st)); } catch (e) {}
    }
    applyTheme(st.theme);
    // The dashboard defines this to pick a layout with the theme.
    if (typeof window.onShuffleStep === 'function') window.onShuffleStep(st);
    // The timer's change gets a confetti rain; a page load or a pick from the
    // selector does not. Another open page may have made the same change.
    if (fromTimer && typeof confettiBlast === 'function' && document.body) confettiBlast();
    clearTimeout(shuffleTimer);
    shuffleTimer = setTimeout(function () { if (shuffling) shuffleStep(true); }, Math.max(1000, st.until - now));
}
try {
    var savedTheme = localStorage.getItem('confetti-theme');
    if (savedTheme === 'shuffle') { shuffling = true; shuffleStep(); }
    else applyTheme(savedTheme);
} catch (e) {}
function setTheme(name) {
    clearTimeout(shuffleTimer);
    shuffling = (name === 'shuffle');
    if (shuffling) {
        // A fresh pick now, not the tail of an earlier shuffle.
        try { localStorage.removeItem('confetti-theme-shuffle'); } catch (e) {}
        shuffleStep();
    } else {
        applyTheme(name);
    }
    try { localStorage.setItem('confetti-theme', shuffling ? 'shuffle' : currentTheme()); } catch (e) {}
    syncThemeSelect();
}
function syncThemeSelect() {
    var sel = document.getElementById('theme-select');
    if (!sel) return;
    if (!sel.options.length) {
        THEMES.concat([['shuffle', 'Shuffle']]).forEach(function (t) {
            var o = document.createElement('option');
            o.value = t[0];
            o.textContent = t[1];
            sel.appendChild(o);
        });
    }
    sel.value = shuffling ? 'shuffle' : currentTheme();
}
// "Confetti!" button: a burst from the button, then rain from the top, in the
// current theme's colours. Plain canvas, no library (the hub may be offline).
// Each click gets its own overlay canvas, removed when the last piece falls off.
function confettiBlast(btn) {
    var css = getComputedStyle(document.documentElement);
    var colors = ['--yellow', '--red', '--green', '--blue', '--cyan']
        .map(function (v) { return css.getPropertyValue(v).trim(); })
        .filter(Boolean);
    if (!colors.length) colors = ['#d29922', '#f85149', '#3fb950', '#58a6ff', '#39c5cf'];
    var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = window.devicePixelRatio || 1;
    var W = window.innerWidth, H = window.innerHeight;
    var cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
    cv.width = W * dpr;
    cv.height = H * dpr;
    document.body.appendChild(cv);
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    var bits = [];
    function add(x, y, vx, vy) {
        bits.push({ x: x, y: y, vx: vx, vy: vy,
            w: 6 + Math.random() * 6, h: 3 + Math.random() * 5,
            rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 0.3,
            sway: Math.random() * 6.28,
            color: colors[Math.floor(Math.random() * colors.length)] });
    }
    if (!calm && btn) {
        var r = btn.getBoundingClientRect();
        var bx = r.left + r.width / 2, by = r.top + r.height / 2;
        for (var i = 0; i < 600; i++) {
            var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
            var s = 8 + Math.random() * 14;
            add(bx, by, Math.cos(a) * s, Math.sin(a) * s);
        }
    }
    var rainTotal = calm ? 320 : 1000, rainLeft = rainTotal;
    var start = performance.now(), last = start;
    function frame(now) {
        var t = now - start, dt = Math.min(2, (now - last) / 16.7);
        // Rain is spread over the first 2 s: this frame's share of the total.
        var due = Math.max(1, Math.round(rainTotal * (now - last) / 2000));
        last = now;
        for (; due > 0 && rainLeft > 0; due--, rainLeft--) {
            add(Math.random() * W, -20 - Math.random() * 40, (Math.random() - 0.5) * 2, 2 + Math.random() * 3);
        }
        ctx.clearRect(0, 0, W, H);
        bits = bits.filter(function (b) {
            b.vy += 0.25 * dt;
            b.vx *= Math.pow(0.98, dt);
            b.vy *= Math.pow(0.98, dt);
            b.sway += 0.1 * dt;
            b.x += (b.vx + Math.sin(b.sway)) * dt;
            b.y += b.vy * dt;
            b.rot += b.spin * dt;
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rot);
            ctx.fillStyle = b.color;
            ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.sway)));
            ctx.restore();
            return b.y < H + 30;
        });
        if ((bits.length || rainLeft > 0) && t < 7000) requestAnimationFrame(frame);
        else cv.remove();
    }
    requestAnimationFrame(frame);
}
</script>

/* Header confetti, every theme but Neon (which has its own streaks). The

 0 t6 0' stroke='black' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Crect x='558' y='31' width='3' height='8' rx='1' transform='rotate(47 559 35)'/%3E%3Crect x='584' y='41' width='3' height='10' rx='1' transform='rotate(-9 585 46)'/%3E%3Cpath d='M631 32 q3 -4 6 0 t6 0' stroke='black' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");

/* Neon header: glowing streaks instead of confetti, as background layers
   only. Odd tile sizes keep the repeat from lining up. */
:root[data-theme="neon"] header {
    border-bottom-color: #ff2d95;
    background-image:
        radial-gradient(1.5px 7px, #ff8c00 0 60%, transparent 100%),
        radial-gradient(1.5px 8px, #39ff14 0 60%, transparent 100%),
        radial-gradient(1.5px 6px, #00f0ff 0 60%, transparent 100%),
        radial-gradient(1.5px 7px, #fff200 0 60%, transparent 100%),
        radial-gradient(1.5px 8px, #ff2d95 0 60%, transparent 100%);
    background-size: 103px 43px, 139px 57px, 167px 39px, 119px 51px, 157px 47px;
    background-position: 13px 9px, 53px 21px, 91px 5px, 29px 27px, 71px 15px;
}
/* Neon boxes: the filter bar, pinned bar, table and empty note each get a
   bright colour. Inside them the palette flips to dark text and deep status
   colours, and the fills become tints, so everything still reads. */
:root[data-theme="neon"] .filters,
:root[data-theme="neon"] .pinned,
:root[data-theme="neon"] #log,
:root[data-theme="neon"] #empty {
    --text:      #000000;
    --text-dim:  #1f1f1f;
    --bg:        rgba(255,255,255,.35);
    --bg-hover:  rgba(0,0,0,.10);
    --bg-muted:  rgba(0,0,0,.14);
    --bg-code:   rgba(0,0,0,.12);
    --stripe:    rgba(0,0,0,.05);
    --border:    rgba(0,0,0,.45);
    --border-soft: rgba(0,0,0,.20);
    --row-line:  rgba(0,0,0,.20);
    --badge-bg:  rgba(255,255,255,.45);
    --badge-border: rgba(0,0,0,.45);
    --green:     #00661a;
    --green-bg:  rgba(0,102,26,.15);
    --red:       #a50018;
    --red-bg:    rgba(165,0,24,.15);
    --yellow:    #6b4f00;
    --yellow-bg: rgba(107,79,0,.15);
    --blue:      #003f9e;
    --cyan:      #004e5a;
    --gray:      #333333;
    --bg-card:   #ff9f1c;
}
:root[data-theme="neon"] .filters { --bg-card: #00e5ff; background: var(--bg-card); }
:root[data-theme="neon"] .pinned  { --bg-card: #ffe600; background: var(--bg-card); }
:root[data-theme="neon"] #log     { --bg-card: #ff9f1c; background: var(--bg-card); }
:root[data-theme="neon"] #empty   { --bg-card: #ff7ac8; background: var(--bg-card); }
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* Header matches the dashboard's: same font, sizes, padding and spacing. */
header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--bg-card);
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace;
}
header h1 {
    font-size: 16px; margin: 0; font-weight: 600;
    color: var(--cyan); letter-spacing: 0.5px; white-space: nowrap;
}

/* Same nav set as the other hub pages' headers: links to the other pages, and
   a non-clickable marker for the page you're already on. Kept identical
   between the three templates so it reads as one component. */
.btn-nav {
    background: var(--bg-hover);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 18px;
    padding: 4px 12px;
    border-radius: 0;
    text-decoration: none;
}
.btn-nav:hover { background: var(--cyan); color: var(--bg); text-decoration: none; }
.btn-nav-current {
    background: var(--cyan);
    border: 1px solid var(--cyan);
    color: var(--bg);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 18px;
    padding: 4px 12px;
    border-radius: 0;
    cursor: default;
}
.theme-select { cursor: pointer; margin-left: 8px; }
.theme-select option { background: var(--bg-card); color: var(--text); }
.status { margin-left: auto; color: var(--text-dim); font-size: 11px; }
.filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; border-bottom: 1px solid var(--border);
}
label { color: var(--text-dim); font-size: 12px; }
select, input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 0; padding: 4px 6px; font: inherit; font-size: 12px;
}
input[type=text] { min-width: 220px; }
button {
    background: var(--bg-hover); color: var(--text); border: 1px solid var(--border);
    border-radius: 0; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
}
button:hover { border-color: var(--blue); }
#toggle-live.off { color: var(--text-dim); }
#toggle-live.on  { color: var(--green); border-color: var(--green); }
.pinned {
    display: none; align-items: center; gap: 10px; padding: 6px 10px;
    background: var(--yellow-bg); border-bottom: 1px solid var(--border); color: var(--yellow);
    font-size: 12px;
}
table { width: 100%; border-collapse: collapse; }
th {
    position: sticky; top: 0; background: var(--bg-card); text-align: left;
    padding: 6px 10px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--text-dim); border-bottom: 1px solid var(--border);
}
td { padding: 4px 10px; border-bottom: 1px solid var(--row-line); vertical-align: top; }
tr:hover td { background: var(--bg-hover); }
td.time { color: var(--text-dim); white-space: nowrap; }
td.src { color: var(--blue); white-space: nowrap; }
td.mnem { color: var(--text-dim); white-space: nowrap; }
td.msg { width: 100%; word-break: break-word; }
.sev { display: inline-block; min-width: 76px; text-align: center; white-space: nowrap;
       border-radius: 0; padding: 0 6px; font-size: 11px; }
td.sevcol { white-space: nowrap; }
.sev-0, .sev-1, .sev-2, .sev-3 { background: var(--red-bg); color: var(--red); }
.sev-4 { background: var(--yellow-bg); color: var(--yellow); }
.sev-5, .sev-6 { background: var(--green-bg); color: var(--green); }
.sev-7, .sev-x { background: var(--bg-muted); color: var(--gray); }
.empty { padding: 12px 10px; text-align: center; color: var(--text-dim); }
.count { color: var(--text-dim); font-size: 12px; }
.clock { font-size: 12px; }
.clock.ok { color: var(--green); }
.clock.warn { color: var(--yellow); }
.clock.bad { color: var(--red); }
/* Footer buttons, same look and place as the dashboard's. */
.page-footer { text-align: center; padding: 12px 0 16px; }
.btn-small {
    display: inline-block;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 0;
    cursor: pointer;
    text-decoration: none;
}
.btn-small:hover { color: var(--text); border-color: var(--blue); }
</style>
</head>
<body>

<header>
    <h1>SYSLOG MESSAGES</h1>
    <a href="/" class="btn-nav">Dashboard</a>
    <span class="btn-nav-current">Syslog</span>
    <a href="/timeline" class="btn-nav">Timeline</a>
    <div class="status">
        <span id="clock" class="clock" title="Hub clock — every correlation on this page depends on it">clock: --</span>
        &nbsp;|&nbsp;
        <span id="count" class="count">--</span>
        &nbsp;|&nbsp;
        <span id="updated">--</span>
        <select id="theme-select" class="btn-nav theme-select" aria-label="Colour theme" onchange="setTheme(this.value)"></select>
        <script>syncThemeSelect();</script>
    </div>
</header>

<div class="pinned" id="pinned">
    <span id="pinned-text"></span>
    <button id="clear-window">Clear window</button>
</div>

<div class="filters">
    <label for="f-source">Source</label>
    <select id="f-source"><option value="">all</option></select>

    <label for="f-sev">Severity &le;</label>
    <select id="f-sev">
        <option value="all">all</option>
        <option value="3">3 err</option>
        <option value="4">4 warning</option>
        <option value="5">5 notice</option>
        <option value="6">6 info</option>
    </select>

    <label for="f-window">Window</label>
    <select id="f-window">
        <option value="15">15 min</option>
        <option value="60">1 hour</option>
        <option value="360">6 hours</option>
        <option value="1440">24 hours</option>
        <option value="525600" selected>everything</option>
    </select>

    <label for="f-q">Search</label>
    <input type="text" id="f-q" placeholder="text, mnemonic, interface…">

    <button id="refresh-now">Refresh</button>
    <button id="toggle-live" class="on">Live Refresh: On</button>
</div>

<table id="log">
    <thead>
        <tr>
            <th style="width:170px">Received</th>
            <th style="width:120px">Source</th>
            <th style="width:80px">Sev</th>
            <th style="width:200px">Mnemonic</th>
            <th>Message</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<div class="empty" id="empty">No messages match.</div>

<div class="page-footer">
    <a class="btn-small" href="https://isitdns.com/" target="_blank" rel="noopener noreferrer">Is it DNS..?</a>
    <button class="btn-small" type="button" onclick="confettiBlast(this)">Confetti!</button>
</div>

<script>
(function() {
    "use strict";

    var SEV_NAMES = ["emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"];
    var params = new URLSearchParams(window.location.search);
    // A window handed over from the dashboard pins the view: no auto-refresh,
    // because the point is to look at a moment that has already passed.
    var pinFrom = params.get("from");
    var pinTo = params.get("to");
    var timer = null;

    if (params.get("host")) {
        // filled in once the source list loads
    }
    if (params.get("q")) document.getElementById("f-q").value = params.get("q");
    if (params.get("severity")) document.getElementById("f-sev").value = params.get("severity");

    function esc(s) {
        if (s === null || s === undefined) return "";
        var d = document.createElement("div");
        d.appendChild(document.createTextNode(String(s)));
        return d.innerHTML;
    }

    function localTime(iso) {
        if (!iso) return "";
        var t = iso.indexOf("Z") === -1 && iso.indexOf("+") === -1 ? iso + "Z" : iso;
        var d = new Date(t);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, {hour12: false});
    }

    function buildQuery() {
        var qs = new URLSearchParams();
        var host = document.getElementById("f-source").value;
        var sev = document.getElementById("f-sev").value;
        var q = document.getElementById("f-q").value.trim();

        if (pinFrom || pinTo) {
            if (pinFrom) qs.set("from", pinFrom);
            if (pinTo) qs.set("to", pinTo);
        } else {
            qs.set("minutes", document.getElementById("f-window").value);
        }
        if (host) qs.set("host", host);
        if (sev !== "all") qs.set("severity", sev);
        if (q) qs.set("q", q);
        qs.set("limit", "2000");
        return qs.toString();
    }

    function render(rows) {
        var tbody = document.querySelector("#log tbody");
        var html = "";
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var sev = (r.severity === null || r.severity === undefined) ? null : r.severity;
            var sevCls = sev === null ? "sev-x" : "sev-" + sev;
            var sevText = sev === null ? "?" : sev + " " + SEV_NAMES[sev];
            html += "<tr>";
            html += "<td class='time'>" + esc(localTime(r.received_at)) + "</td>";
            html += "<td class='src' title='" + esc(r.source_ip) + "'>" + esc(r.host || r.source_ip) + "</td>";
            html += "<td class='sevcol'><span class='sev " + sevCls + "'>" + esc(sevText) + "</span></td>";
            html += "<td class='mnem'>" + esc(r.mnemonic || "") + "</td>";
            html += "<td class='msg' title='" + esc(r.device_time || "") + "'>" + esc(r.message) + "</td>";
            html += "</tr>";
        }
        tbody.innerHTML = html;
        document.getElementById("empty").style.display = rows.length ? "none" : "";
        document.getElementById("count").textContent =
            rows.length + " message" + (rows.length !== 1 ? "s" : "") + (rows.length >= 2000 ? " (capped)" : "");
        document.getElementById("updated").textContent = "Updated: " + new Date().toLocaleTimeString();
    }

    function refresh() {
        fetch("/api/syslog?" + buildQuery())
            .then(function(r) { return r.json(); })
            .then(render)
            .catch(function() {
                document.getElementById("updated").textContent = "Hub unreachable";
            });
    }

    // The hub's own clock decides whether a pinned window means anything, so
    // it is shown next to the message count rather than hidden in a status page.
    function loadClock() {
        fetch("/api/time")
            .then(function(r) { return r.json(); })
            .then(function(t) {
                var el = document.getElementById("clock");
                if (!t.chrony) {
                    el.className = "clock warn";
                    el.textContent = "clock: unknown (" + (t.reason || "no chrony") + ")";
                    return;
                }
                var c = t.chrony;
                var ms = c.system_offset_s === null ? null : Math.abs(c.system_offset_s * 1000);
                var parts = ["stratum " + c.stratum];
                if (ms !== null) parts.push((ms < 1 ? ms.toFixed(2) : ms.toFixed(1)) + " ms off");
                if (c.local_only) parts.push("local clock");
                else if (c.source) parts.push("via " + c.source);

                if (!c.synced) el.className = "clock bad";
                else if (c.local_only || (ms !== null && ms > 100)) el.className = "clock warn";
                else el.className = "clock ok";

                el.textContent = "clock: " + parts.join(", ") + (c.synced ? "" : " — UNSYNCED");
            })
            .catch(function() {
                var el = document.getElementById("clock");
                el.className = "clock warn";
                el.textContent = "clock: unavailable";
            });
    }

    function loadSources() {
        fetch("/api/syslog/sources")
            .then(function(r) { return r.json(); })
            .then(function(rows) {
                var sel = document.getElementById("f-source");
                var want = params.get("host") || "";
                var html = "<option value=''>all</option>";
                for (var i = 0; i < rows.length; i++) {
                    html += "<option value='" + esc(rows[i].name) + "'>" +
                            esc(rows[i].name) + " (" + rows[i].count + ")</option>";
                }
                // A host handed over by a dashboard link may not have logged yet.
                if (want && rows.every(function(r) { return r.name !== want; })) {
                    html += "<option value='" + esc(want) + "'>" + esc(want) + " (none yet)</option>";
                }
                sel.innerHTML = html;
                if (want) sel.value = want;
                refresh();
            });
    }

    // Independent of the pin: a pinned window forces refresh off entirely
    // (the point is a moment that has already passed — see below), while
    // this flag is the viewer's own on/off choice for the live, unpinned
    // view. Defaults on, matching the auto-refresh this page always had.
    var liveRefresh = true;

    function setAutoRefresh() {
        if (timer) clearInterval(timer);
        if (!pinFrom && !pinTo && liveRefresh) timer = setInterval(refresh, 15000);
    }

    function setLiveButton(on) {
        var btn = document.getElementById("toggle-live");
        btn.textContent = "Live Refresh: " + (on ? "On" : "Off");
        btn.className = on ? "on" : "off";
    }

    if (pinFrom || pinTo) {
        document.getElementById("pinned").style.display = "flex";
        document.getElementById("pinned-text").textContent =
            "Pinned window: " + localTime(pinFrom) + " → " + localTime(pinTo) + " (auto-refresh off)";
        document.getElementById("f-window").disabled = true;
        document.getElementById("toggle-live").style.display = "none";
    }

    document.getElementById("toggle-live").addEventListener("click", function() {
        liveRefresh = !liveRefresh;
        setLiveButton(liveRefresh);
        setAutoRefresh();
    });

    document.getElementById("clear-window").addEventListener("click", function() {
        pinFrom = pinTo = null;
        document.getElementById("pinned").style.display = "none";
        document.getElementById("f-window").disabled = false;
        document.getElementById("toggle-live").style.display = "";
        setAutoRefresh();
        refresh();
    });

    ["f-source", "f-sev", "f-window"].forEach(function(id) {
        document.getElementById(id).addEventListener("change", refresh);
    });
    document.getElementById("f-q").addEventListener("keyup", function(e) {
        if (e.key === "Enter") refresh();
    });
    document.getElementById("refresh-now").addEventListener("click", refresh);

    loadSources();
    loadClock();
    setInterval(loadClock, 60000);
    setAutoRefresh();
})();
</script>
</body>
</html>
