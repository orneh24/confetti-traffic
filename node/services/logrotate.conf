# Log rotation for confetti on nodes.
#
# confettictl-test-cycle.sh runs every 60 seconds and appends full traceroute output for
# every target. At 4-5 targets that is roughly 5-10 MB per day, which will
# fill a 2 GB template disk within a few weeks if left unrotated.
#
# Installed to /etc/logrotate.d/confetti by confettictl-build-template.sh.

/var/log/confetti/*.log {
    daily
    rotate 3
    maxsize 10M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
