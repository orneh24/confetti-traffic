# confetti SMTP probe server — envelope-only, no relay, no local delivery.
#
# Every node runs smtpd (OpenSMTPD) so every peer can hold a lightweight
# conversation against it: banner -> EHLO -> MAIL FROM -> RCPT TO -> RSET ->
# QUIT. It never issues DATA. The point isn't to move mail — it's to read
# back the EHLO capability list and catch a device that inspects SMTP and
# silently *rewrites* it (SMTP ALG / ESMTP inspection — common on firewalls
# and NAT gateways — masks unrecognised capability verbs with runs of X,
# e.g. "250-XXXXXXXX" instead of "250-STARTTLS"). smb (see smb.conf) catches
# inspection that drops or stalls a session; this catches inspection that
# edits one.
#
# Installed to /etc/smtpd/smtpd.conf by confettictl-build-template.sh / confettictl-setup.sh. Only
# started when ENABLE_SMTP=true (see confettictl-test-cycle.sh, confettictl-setup.sh, config.sample).
# Unlike smb's gated arm, the static-target SMTP test runs unconditionally —
# see confettictl-test-cycle.sh's static-target case arm for why that asymmetry is
# deliberate, not an oversight.
#
# ---------------------------------------------------------------------------
# THE SINGLE MOST IMPORTANT LINE IN THIS FILE IS THE ONE THAT'S NOT HERE:
# no `relay` action, anywhere, ever. Without one configured, smtpd has no
# path to hand a message to another SMTP server — it cannot originate
# outbound mail, full stop, even though a node may sit behind NAT with a
# real default route off the lab. "It's an isolated lab" is not a valid
# defence for this one.
#
# This is not theoretical. The Alpine opensmtpd package's OWN DEFAULT
# /etc/smtpd/smtpd.conf (verified against the installed package, v3.20
# community, 7.5.0_p0-r0) ships exactly the action this file must never
# have:
#     action "relay" relay
#     match from local for any action "relay"
# — an open relay for anything originated on the box. confettictl-build-template.sh's
# `cp -f` over that default is therefore load-bearing, not cosmetic: if it
# silently failed to install this file (missing source, wrong path), the
# image would ship with a working relay path to a real internet gateway.
# The build-time grep for `action ... relay` (confettictl-build-template.sh, after the
# service files are installed) is the safety net for exactly that failure.
# ---------------------------------------------------------------------------

# Not bound to a specific interface, for the same reason smb.conf gives:
# confettictl-build-template.sh runs before a clone's inside NIC is known (DHCP-assigned,
# varies per VM). 0.0.0.0 binds every interface. If a specific deployment
# knows its interface name ahead of time:
#   listen on eth0
listen on 0.0.0.0 port 25

# Resource caps for a 128 MB VM. OpenSMTPD's config grammar has no directive
# for capping concurrent sessions (unlike smbd's "max smbd processes" /
# "deadtime") — these are the caps that DO exist, and they bound what a
# single session can do rather than how many run at once. Our own probe
# sends exactly one MAIL FROM and one RCPT TO per session, so this is
# headroom against a misbehaving or malicious peer, not tuned to our own
# traffic.
smtp limit max-mails 5
smtp limit max-rcpt 5
smtp max-message-size 1M

# No TLS: closed lab segment, and STARTTLS would let a client hide the
# plaintext capability list behind encryption — exactly the thing this probe
# exists to read. Offering TLS here would also give an ALG something to
# terminate/rewrite invisibly, defeating the test a second way.

# The action must be declared BEFORE the match rule that names it. With the
# order reversed, every OpenSMTPD version rejects the file ("no such
# dispatcher: sink"), smtpd never starts, and every SMTP test in the mesh
# fails. That shipped: confettictl-build-template.sh's `smtpd -n` check caught it only as
# a warning.
#
# Discard-only. "mda" hands the message to a command on its stdin, and it
# runs as nobody, matching smb.conf's guest account -- never root. No
# message is ever accepted in practice: our probe sends RSET before DATA, and
# RCPT for probe@ gets a 550, because there is no local user "probe". The
# probe records that 550 as data; it does not fail the test.
action "sink" mda "/bin/cat > /dev/null" user nobody

# Exactly one match rule, scoped to the RFC 2606 reserved ".invalid" TLD —
# never "for any". An envelope addressed anywhere else is rejected at RCPT
# time, same as if no match rule existed at all.
match for domain "confetti.invalid" action "sink"
